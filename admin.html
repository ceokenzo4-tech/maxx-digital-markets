<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAXX Admin</title><link rel="stylesheet" href="styles.css?v=20260922-admin"></head><body><main class="container" style="padding-top:40px;padding-bottom:60px"><h1>MAXX Admin Console</h1><p class="muted">Private administration for users, demo balances, orders and genuine review moderation. Demo balances are simulated and must not be represented as withdrawable customer funds.</p><div class="card" style="display:flex;gap:10px;flex-wrap:wrap"><input id="key" type="password" placeholder="Admin key" style="flex:1;min-width:220px"><button class="btn primary" onclick="loadAll()">Load dashboard</button></div><h2>Users & demo balances</h2><div id="users"></div><h2>Orders</h2><div id="orders"></div><h2>Customer reviews</h2><div id="reviews"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function req(path,opt={}){opt.headers={...(opt.headers||{}),'content-type':'application/json','x-admin-key':document.querySelector('#key').value};const r=await fetch(path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function loadAll(){try{const [u,o,v]=await Promise.all([req('/api/admin/users'),req('/api/admin/orders'),req('/api/admin/reviews')]);document.querySelector('#users').innerHTML=u.users.map(x=>`<div class="card" style="margin:12px 0"><b>${esc(x.name)}</b> <span class="muted">${esc(x.email)}</span><p>Demo balance: <b>$${Number(x.demoBalance||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</b> • ${x.verified?'Verified':'Unverified'}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="a-${x.id}" type="number" step="0.01" placeholder="+500 or -100"><input id="n-${x.id}" placeholder="Reason / audit note"><button class="btn primary" onclick="balance('${x.id}')">Adjust demo balance</button>${x.verified?'':`<button class="btn" onclick="verifyUser('${x.id}')">Verify user</button>`}</div></div>`).join('')||'<p>No users.</p>';document.querySelector('#orders').innerHTML=o.orders.map(x=>`<div class="card" style="margin:12px 0"><b>${esc(x.id)} — ${esc(x.side.toUpperCase())} ${esc(x.asset)}</b><p>${esc(x.fiat)} ${esc(x.amount)} • status <b>${esc(x.status)}</b></p><p>Customer proof: ${esc(x.customerProof||'Not submitted')}</p>${x.proofImageFile?`<button class="btn" onclick="viewProof('${x.id}')">View proof</button>`:''}<select id="s-${x.id}"><option>funds_verified</option><option>crypto_verified</option><option>payout_sent</option><option>crypto_sent</option><option>completed</option><option>cancelled</option><option>failed</option></select><button class="btn primary" onclick="setStatus('${x.id}')">Update</button></div>`).join('')||'<p>No orders.</p>';document.querySelector('#reviews').innerHTML=v.reviews.map(r=>`<div class="card" style="margin:12px 0"><b>${esc(r.name)} • ${'★'.repeat(r.rating)}</b><p>${esc(r.text)}</p><p class="muted">Status: ${esc(r.status)}</p><button class="btn primary" onclick="review('${r.id}','approved')">Approve genuine review</button> <button class="btn" onclick="review('${r.id}','rejected')">Reject</button></div>`).join('')||'<p>No reviews.</p>'}catch(e){alert(e.message)}}
async function balance(id){try{const amount=Number(document.querySelector('#a-'+id).value),note=document.querySelector('#n-'+id).value;if(!confirm(`Adjust DEMO balance by $${amount}? This is logged.`))return;await req('/api/admin/users/'+id+'/balance',{method:'POST',body:JSON.stringify({amount,note})});loadAll()}catch(e){alert(e.message)}}
async function verifyUser(id){try{await req('/api/admin/users/'+id+'/verify',{method:'PATCH',body:'{}'});loadAll()}catch(e){alert(e.message)}}
async function review(id,status){try{await req('/api/admin/reviews/'+id,{method:'PATCH',body:JSON.stringify({status})});loadAll()}catch(e){alert(e.message)}}
async function setStatus(id){try{await req('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status:document.querySelector('#s-'+id).value})});loadAll()}catch(e){alert(e.message)}}
async function viewProof(id){try{const r=await fetch('/api/admin/orders/'+id+'/proof-image',{headers:{'x-admin-key':document.querySelector('#key').value}});if(!r.ok)throw Error('Could not load proof');const url=URL.createObjectURL(await r.blob());window.open(url,'_blank','noopener,noreferrer');setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert(e.message)}}
</script><script src="support.js"></script></body></html>
